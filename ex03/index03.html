<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists & Tables</title>
</head>
<body>
    <h2>Favorite Programming Languages</h2>
<ul>
    <li>Python</li>
    <li>HTML</li>
    <li>CSS</li>
</ul>
<h2>Step-by-step Workflow</h2>

<ol>
    <li>Planning</li>
    
    <li>Development
        <ul>
            <li>Write HTML structure</li>
            <li>Style with CSS</li>
        </ul>
    </li>

    <li>Deployment</li>
</ol>
<table>
    <caption>Weekly Study Timetable</caption>
    
    <thead>
        <tr>
            <th scope="col">Day</th>
            <th scope="col">Subject</th>
            <th scope="col">Hours</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>2 Hours</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>CSS</td>
            <td>3 Hours</td>
        </tr>
    </tbody>
</table>
</body>
</html>
